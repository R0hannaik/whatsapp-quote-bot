name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test            # includes the browser tests (Chrome is preinstalled on GitHub's runners)
      - run: npm audit --omit=dev

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docker-compose.yml
        run: cp .env.example .env && docker compose config --quiet   # real servers have their own .env
      - name: Build image
        run: docker build -t quotebot .
      - name: Start container and wait for it to be healthy
        run: |
          docker run -d --name qb -e DASHBOARD_PASSWORD=ci-password-123 -e WA_DISABLED=1 -p 3000:3000 quotebot
          for i in $(seq 1 30); do
            s=$(docker inspect -f '{{.State.Health.Status}}' qb); echo "health: $s"
            [ "$s" = healthy ] && break; sleep 3
          done
          [ "$(docker inspect -f '{{.State.Health.Status}}' qb)" = healthy ]
          curl -fsS http://127.0.0.1:3000/healthz
          curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:3000/login
          docker exec qb sh -c 'test -w /app/data && ls -ld /app/data'
      - name: Data survives a restart
        run: |
          curl -fsS -c c.txt -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:3000' -d '{"password":"ci-password-123"}' http://127.0.0.1:3000/api/login
          curl -fsS -b c.txt -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:3000' -d '{"name":"CI Chemical","aliases":"cic","price":1}' http://127.0.0.1:3000/api/chemicals
          docker restart qb && sleep 8
          curl -fsS -c c.txt -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:3000' -d '{"password":"ci-password-123"}' http://127.0.0.1:3000/api/login
          curl -fsS -b c.txt http://127.0.0.1:3000/api/chemicals | grep -q "CI Chemical"
      - name: App runs as "node", not root
        run: |
          docker exec qb sh -c 'grep -E "^(Uid|CapEff)" /proc/1/status'
          [ "$(docker exec qb stat -c %U /proc/1)" = node ]
          docker exec qb sh -c 'grep -q "^CapEff:\s*0000000000000000" /proc/1/status'
      - name: Works with a root-owned disk (like Render / Fly.io volumes)
        run: |
          sudo mkdir -p /tmp/rootdisk && sudo chown root:root /tmp/rootdisk && sudo chmod 755 /tmp/rootdisk
          docker run -d --name qb2 -e DASHBOARD_PASSWORD=ci-password-123 -e WA_DISABLED=1 -e TRIAL_MODE=1 -v /tmp/rootdisk:/app/data -p 3001:3000 quotebot
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3001/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:3001/healthz
          sudo test -f /tmp/rootdisk/quotebot.db
          [ "$(sudo stat -c %U /tmp/rootdisk/quotebot.db)" != root ]
          [ "$(sudo stat -c %a /tmp/rootdisk)" = 700 ]
      - if: failure()
        run: docker logs qb; docker logs qb2 || true

  installer:                     # the one-command server set-up, run on a fresh Ubuntu machine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/install-server.sh scripts/docker-entrypoint.sh
      - name: Run install-server.sh (trial, local copy of this commit)
        run: |
          sudo git config --global --add safe.directory '*'      # cloning the runner's checkout as root
          sudo env REPO="$GITHUB_WORKSPACE" DOMAIN=localhost TRIAL=1 CONTACT_PHONE='+91 90000 00000' bash scripts/install-server.sh < /dev/null
      - name: Dashboard answers over HTTPS through Caddy
        run: |
          for i in $(seq 1 30); do curl -kfsS https://localhost/healthz && break; sleep 3; done
          curl -kfsS https://localhost/healthz
          curl -kfsS -o /dev/null -w "%{http_code}\n" https://localhost/login
          sudo test "$(sudo stat -c %a /opt/quotebot/.env)" = 600
          sudo grep -q '^TRIAL_MODE=1' /opt/quotebot/.env
          sudo grep -Eq '^DASHBOARD_PASSWORD=[0-9a-f]{24}$' /opt/quotebot/.env
      - name: Running it again keeps the password and data
        run: |
          before=$(sudo grep '^DASHBOARD_PASSWORD=' /opt/quotebot/.env)
          sudo env REPO="$GITHUB_WORKSPACE" bash scripts/install-server.sh < /dev/null
          [ "$(sudo grep '^DASHBOARD_PASSWORD=' /opt/quotebot/.env)" = "$before" ]
          curl -kfsS https://localhost/healthz
      - if: failure()
        run: cd /opt/quotebot && sudo docker compose logs

  docker-arm64:                  # Oracle Cloud's free Ampere servers are ARM
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t quotebot .
      - run: |
          docker run -d --name qb -e DASHBOARD_PASSWORD=ci-password-123 -e WA_DISABLED=1 -p 3000:3000 quotebot
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:3000/healthz
          [ "$(docker exec qb uname -m)" = aarch64 ]
      - if: failure()
        run: docker logs qb
