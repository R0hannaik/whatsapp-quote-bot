<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Join our WhatsApp groups</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/app.css">
  <style>
    body { background: linear-gradient(180deg, #0f172a 0, #0f172a 260px, var(--bg) 260px); min-height: 100vh; }
    header { color: #fff; text-align: center; padding: 42px 16px 24px; }
    header h1 { margin: 0; font-size: 28px; letter-spacing: -.02em; }
    header p { margin: 8px 0 0; color: #cbd5e1; }
    .grid { max-width: 1100px; margin: 0 auto; padding: 0 16px 50px; display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 22px; }
    .qr-card { box-shadow: 0 10px 30px rgba(15,23,42,.12); padding: 24px; }
    .qr-card img { width: 240px; height: 240px; }
    .bar { height: 6px; background: #e2e8f0; border-radius: 99px; overflow: hidden; margin: 12px auto 0; max-width: 240px; }
    .bar i { display: block; height: 100%; background: var(--green); transition: width 1s linear; }
    .note { text-align: center; color: var(--muted); font-size: 14px; padding: 0 16px 30px; }
  </style>
</head>
<body>
  <header><h1 id="title">Join our WhatsApp groups</h1><p>Scan with your phone camera or WhatsApp. Codes refresh automatically — always scan the one on this page.</p></header>
  <div class="grid" id="grid"><div class="qr-card"><p class="muted">Loading…</p></div></div>
  <p class="note" id="note"></p>
  <script src="/assets/join.js"></script>
</body>
</html>
